const fail = (error        )                => ({ ok: false, error });
const good =     (value   )            => ({ ok: true, value });

const bad = (n         )          => typeof n !== 'number' || !Number.isFinite(n);
const neg = (n        )          => n < 0;

/** Marge brute = (prix de vente − coût) / prix de vente. Taux de marque = (prix − coût) / coût. */
function margin(sellingPrice        , cost        )                                                                          {
  if (bad(sellingPrice) || bad(cost)) return fail('Valeur manquante ou invalide.');
  if (neg(sellingPrice) || neg(cost)) return fail('Les valeurs ne peuvent pas être négatives.');
  if (sellingPrice === 0) return fail('Le prix de vente doit être supérieur à 0.');
  const amount = sellingPrice - cost;
  return good({ amount, marginPct: (amount / sellingPrice) * 100, markupPct: cost === 0 ? null : (amount / cost) * 100 });
}

                              
                                                              
                                                                                     
                                                       
 
/** Bénéfice estimé = CA − (achats + transport + taxes + emballage + autres + commission). */
function estimatedProfit(i             )                                                                                     {
  const { transport = 0, taxesAndFees = 0, packaging = 0, otherCosts = 0, commissionPct = 0 } = i;
  const all = [i.unitPurchase, i.quantity, i.unitSelling, transport, taxesAndFees, packaging, otherCosts, commissionPct];
  if (all.some(bad)) return fail('Valeur manquante ou invalide.');
  if (all.some(neg)) return fail('Les valeurs ne peuvent pas être négatives.');
  if (i.quantity === 0) return fail('La quantité doit être supérieure à 0.');
  if (commissionPct > 100) return fail('La commission ne peut pas dépasser 100 %.');
  const revenue = i.unitSelling * i.quantity;
  const totalCosts = i.unitPurchase * i.quantity + transport + taxesAndFees + packaging + otherCosts + revenue * (commissionPct / 100);
  const profit = revenue - totalCosts;
  return good({ revenue, totalCosts, profit, profitPct: revenue === 0 ? 0 : (profit / revenue) * 100 });
}

/** Prix de vente pour une marge cible (sur prix de vente) : prix = coût / (1 − marge). */
function sellingPriceForMargin(unitCost        , targetMarginPct        )                 {
  if (bad(unitCost) || bad(targetMarginPct)) return fail('Valeur manquante ou invalide.');
  if (neg(unitCost) || neg(targetMarginPct)) return fail('Les valeurs ne peuvent pas être négatives.');
  if (targetMarginPct >= 100) return fail('Une marge de 100 % ou plus est impossible.');
  return good(unitCost / (1 - targetMarginPct / 100));
}

/** Seuil de rentabilité (unités) = charges fixes / (prix unitaire − coût variable unitaire). */
function breakEven(fixedCosts        , unitPrice        , unitVariableCost        )                            {
  if ([fixedCosts, unitPrice, unitVariableCost].some(bad)) return fail('Valeur manquante ou invalide.');
  if ([fixedCosts, unitPrice, unitVariableCost].some(neg)) return fail('Les valeurs ne peuvent pas être négatives.');
  const contribution = unitPrice - unitVariableCost;
  if (contribution <= 0) return fail('Le prix doit dépasser le coût variable : le seuil est inatteignable.');
  return good({ units: Math.ceil(fixedCosts / contribution) });
}

/** Coût de livraison = forfait + tarif au kg × poids. Les tarifs sont saisis par l'utilisateur. */
function deliveryCost(base        , perKg        , weightKg        )                 {
  if ([base, perKg, weightKg].some(bad)) return fail('Valeur manquante ou invalide.');
  if ([base, perKg, weightKg].some(neg)) return fail('Les valeurs ne peuvent pas être négatives.');
  return good(base + perKg * weightKg);
}

/** Budget de démarrage = somme des postes saisis. */
function startupBudget(items          )                 {
  if (items.some(bad)) return fail('Valeur manquante ou invalide.');
  if (items.some(neg)) return fail('Les valeurs ne peuvent pas être négatives.');
  return good(items.reduce((a, b) => a + b, 0));
}

                                                                                                                            
/** Comparateur : coût complet par unité = (prix × quantité + transport + taxes) / quantité. Trié du moins cher au plus cher. */
function compareSuppliers(offers                 )                                                                     {
  if (offers.length === 0) return fail('Ajoutez au moins une offre.');
  const rows                                                             = [];
  for (const o of offers) {
    const n = [o.unitPrice, o.quantity, o.shipping, o.taxesAndFees];
    if (n.some(bad)) return fail(`Offre « ${o.name} » : valeur invalide.`);
    if (n.some(neg)) return fail(`Offre « ${o.name} » : valeur négative.`);
    if (o.quantity === 0) return fail(`Offre « ${o.name} » : quantité nulle.`);
    const totalCost = o.unitPrice * o.quantity + o.shipping + o.taxesAndFees;
    rows.push({ name: o.name, totalCost, costPerUnit: totalCost / o.quantity });
  }
  return good(rows.sort((a, b) => a.costPerUnit - b.costPerUnit));
}

const b64d = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));

function wizard(steps, i = 0, ctx = {}) {
  const s = steps[i], last = i === steps.length - 1;
  app.innerHTML = `<div class="prog">${steps.map((_, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('')}</div><p class="meta">Étape ${i + 1} sur ${steps.length}</p><h1>${esc(s.title)}</h1>
  <div class="card form">${s.html(ctx)}<p class="notice" id="err" role="alert" hidden></p></div>
  <div class="nav2"><button class="btn ghost" id="prev" ${i ? '' : 'disabled'}>← Précédent</button><button class="btn" id="next">${last ? esc(s.last || 'Terminer') : 'Suivant →'}</button></div>`;
  if (s.bind) s.bind(ctx);
  document.getElementById('prev').onclick = () => wizard(steps, i - 1, ctx);
  document.getElementById('next').onclick = async () => {
    const err = s.next ? await s.next(ctx) : null;
    if (err) { const e = document.getElementById('err'); e.textContent = err; e.hidden = false; return; }
    if (!last) wizard(steps, i + 1, ctx); else if (s.done) s.done(ctx);
  };
}

function route() {
  const [path, qs] = location.hash.replace(/^#\/?/, '').split('?');
  const [page, arg] = path.split('/'), name = page || 'accueil';
  app.classList.remove('page'); void app.offsetWidth; app.classList.add('page');
  (PAGES[name] || (() => { app.innerHTML = '<p class="notice">Page introuvable.</p>'; }))(arg, new URLSearchParams(qs || '').get('q') || '');
  const tabOf = { pplus: 'premium', vendre: 'boutique', recherche: 'accueil' }[name] || name;
  document.querySelectorAll('.tabs a').forEach(a => a.classList.toggle('active', a.dataset.p === tabOf));
  document.getElementById('back').hidden = name === 'accueil';
  window.scrollTo(0, 0);
}
document.getElementById('back').onclick = () => { if (history.length > 1) history.back(); else location.hash = '#/'; };
window.addEventListener('hashchange', route);
route();
